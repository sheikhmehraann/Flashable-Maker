name: Build Flashable ROM Package (Flashable-Engine)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Images Archive Link (.zip, .rar, .7z, .tar.zst containing .img files - Google Drive, SourceForge, Direct Link)'
        required: true
        type: string
      device_name:
        description: 'Device Name'
        required: true
        default: 'Infinix GT 20 Pro'
        type: string
      device_codename:
        description: 'Device Codename'
        required: true
        default: 'X6871'
        type: string
      rom_version:
        description: 'ROM Version'
        required: true
        default: '15.1.2.180SP05OP001PF001AZ'
        type: string
      maintainer:
        description: 'Maintainer'
        required: true
        default: 'Mehraan'
        type: string
      vbmeta_option:
        description: 'AVB 2.0 / Vbmeta Option'
        required: true
        type: choice
        options:
          - 'enable'
          - 'disable'
          - 'skip'
        default: 'enable'
      zstd_level:
        description: 'ZSTD Compression Level (0 = raw pass-through, 1 = fast, 22 = ultra-compressed)'
        required: true
        default: '22'
        type: string
      zip_level:
        description: 'ZIP Deflate Level (0 = store mode, 9 = max compression)'
        required: true
        default: '9'
        type: string

jobs:
  build:
    name: Fast Flashable Builder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flashable-Engine
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install High-Speed Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 zstd p7zip-full libarchive-tools curl

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Tool Permissions
        run: |
          chmod -R +x bin/host/ || true
          chmod -R +x bin/device/ || true

      - name: Run Build Pipeline & Upload to Gofile
        id: build_step
        run: |
          python main.py \
            --url "${{ github.event.inputs.rom_url }}" \
            --device "${{ github.event.inputs.device_name }}" \
            --codename "${{ github.event.inputs.device_codename }}" \
            --version "${{ github.event.inputs.rom_version }}" \
            --maintainer "${{ github.event.inputs.maintainer }}" \
            --vbmeta "${{ github.event.inputs.vbmeta_option }}" \
            --zstd-level "${{ github.event.inputs.zstd_level }}" \
            --zip-level "${{ github.event.inputs.zip_level }}" \
            --upload "gofile" \
            --output "./output"

      - name: Post Job Summary
        if: always()
        run: |
          echo "## ⚡ Flashable ROM Package Ready" >> $GITHUB_STEP_SUMMARY
          echo "- **Device**: ${{ github.event.inputs.device_name }} (\`${{ github.event.inputs.device_codename }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ github.event.inputs.rom_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Maintainer**: ${{ github.event.inputs.maintainer }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AVB Vbmeta Mode**: \`${{ github.event.inputs.vbmeta_option }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.build_step.outputs.download_page }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 [Download Flashable ZIP from GoFile](${{ steps.build_step.outputs.download_page }})" >> $GITHUB_STEP_SUMMARY
            echo "**File Name**: \`${{ steps.build_step.outputs.zip_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**GoFile Link**: [${{ steps.build_step.outputs.download_page }}](${{ steps.build_step.outputs.download_page }})" >> $GITHUB_STEP_SUMMARY
          fi
