name: Build Flashable ROM Package (Flashable-Engine)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Downloadable ROM Link (Google Drive, SourceForge, MediaFire, Direct URL, GitHub Release)'
        required: true
        type: string
      device_name:
        description: 'Device Name'
        required: true
        default: 'Infinix GT 20 Pro'
        type: string
      device_codename:
        description: 'Device Codename'
        required: true
        default: 'X6871'
        type: string
      rom_version:
        description: 'ROM Version'
        required: true
        default: '15.1.2.180SP05'
        type: string
      maintainer:
        description: 'Maintainer'
        required: true
        default: 'Mehraan'
        type: string
      vbmeta_option:
        description: 'AVB 2.0 / Vbmeta Option'
        required: true
        type: choice
        options:
          - 'skip'
          - 'disable'
          - 'enable'
        default: 'skip'
      compression_format:
        description: 'Partition Compression Format'
        required: true
        type: choice
        options:
          - 'zstd'
          - 'raw'
          - 'erofs'
        default: 'zstd'
      zstd_level:
        description: 'ZSTD Compression Level'
        required: true
        default: '9'
        type: string
      include_fastboot:
        description: 'Include PC Fastboot Flasher (Windows .bat & Linux .sh)'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Fast Flashable Builder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flashable-Engine
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install High-Speed Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 zstd libarchive-tools curl

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Tool Permissions
        run: |
          chmod -R +x bin/host/ || true
          chmod -R +x bin/device/ || true

      - name: Run Build Pipeline & Upload to Gofile
        id: build_step
        run: |
          FASTBOOT_FLAG=""
          if [ "${{ github.event.inputs.include_fastboot }}" != "true" ]; then
            FASTBOOT_FLAG="--no-fastboot"
          fi

          python main.py \
            --url "${{ github.event.inputs.rom_url }}" \
            --device "${{ github.event.inputs.device_name }}" \
            --codename "${{ github.event.inputs.device_codename }}" \
            --version "${{ github.event.inputs.rom_version }}" \
            --maintainer "${{ github.event.inputs.maintainer }}" \
            --vbmeta "${{ github.event.inputs.vbmeta_option }}" \
            --compression "${{ github.event.inputs.compression_format }}" \
            --zstd-level "${{ github.event.inputs.zstd_level }}" \
            --upload "gofile" \
            --output "./output" \
            $FASTBOOT_FLAG
