name: Build Flashable ROM Package (Flashable-Engine)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Images Archive Link (.zip, .rar, .7z, .tar.zst containing .img files - Google Drive, SourceForge, Direct Link)'
        required: true
        type: string
      device_name:
        description: 'Device Name'
        required: true
        default: 'Infinix GT 20 Pro'
        type: string
      device_codename:
        description: 'Device Codename'
        required: true
        default: 'X6871'
        type: string
      rom_version:
        description: 'ROM Version'
        required: true
        default: '15.1.2.180SP05OP001PF001AZ'
        type: string
      maintainer:
        description: 'Maintainer'
        required: true
        default: 'Mehraan'
        type: string
      vbmeta_option:
        description: 'AVB 2.0 / Vbmeta Option'
        required: true
        type: choice
        options:
          - 'enable'
          - 'disable'
          - 'skip'
        default: 'enable'
      zstd_level:
        description: 'ZSTD Compression Level (0 = raw pass-through, 1 = fast, 22 = ultra-compressed)'
        required: true
        default: '22'
        type: string
      zip_level:
        description: 'ZIP Deflate Level (0 = store mode, 9 = max compression)'
        required: true
        default: '9'
        type: string

jobs:
  build:
    name: Fast Flashable Builder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Flashable-Engine
        uses: actions/checkout@v4

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install High-Speed Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 zstd p7zip-full libarchive-tools curl

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Tool Permissions & PATH
        run: |
          chmod -R +x bin/host/ || true
          chmod -R +x bin/device/ || true
          chmod +x bin/zstd-arm64 || true
          echo "$GITHUB_WORKSPACE/bin/host" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Run Build Pipeline & Upload to Gofile
        id: build_step
        env:
          ROM_URL: ${{ github.event.inputs.rom_url }}
          DEV_NAME: ${{ github.event.inputs.device_name }}
          CODENAME: ${{ github.event.inputs.device_codename }}
          ROM_VER: ${{ github.event.inputs.rom_version }}
          MAINTAINER: ${{ github.event.inputs.maintainer }}
          VBMETA: ${{ github.event.inputs.vbmeta_option }}
          ZSTD_LVL: ${{ github.event.inputs.zstd_level }}
          ZIP_LVL: ${{ github.event.inputs.zip_level }}
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: |
          python main.py \
            --url "$ROM_URL" \
            --device "$DEV_NAME" \
            --codename "$CODENAME" \
            --version "$ROM_VER" \
            --maintainer "$MAINTAINER" \
            --vbmeta "$VBMETA" \
            --zstd-level "$ZSTD_LVL" \
            --zip-level "$ZIP_LVL" \
            --upload "gofile" \
            --output "./output"

      - name: Post Job Summary
        if: always()
        env:
          DEV_NAME: ${{ github.event.inputs.device_name }}
          CODENAME: ${{ github.event.inputs.device_codename }}
          ROM_VER: ${{ github.event.inputs.rom_version }}
          MAINTAINER: ${{ github.event.inputs.maintainer }}
          VBMETA: ${{ github.event.inputs.vbmeta_option }}
          DL_PAGE: ${{ steps.build_step.outputs.download_page }}
          ZIP_NAME: ${{ steps.build_step.outputs.zip_name }}
          BUILD_OUTCOME: ${{ steps.build_step.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ]; then
            echo "## ⚡ Flashable ROM Package Ready" >> $GITHUB_STEP_SUMMARY
            echo "- **Device**: $DEV_NAME (\`$CODENAME\`)" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`$ROM_VER\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Maintainer**: $MAINTAINER" >> $GITHUB_STEP_SUMMARY
            echo "- **AVB Vbmeta Mode**: \`$VBMETA\`" >> $GITHUB_STEP_SUMMARY
            if [ -n "$DL_PAGE" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### 🚀 [Download Flashable ZIP from GoFile]($DL_PAGE)" >> $GITHUB_STEP_SUMMARY
              echo "**File Name**: \`$ZIP_NAME\`" >> $GITHUB_STEP_SUMMARY
              echo "**GoFile Link**: [$DL_PAGE]($DL_PAGE)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## ❌ Flashable ROM Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "Please inspect the build logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
